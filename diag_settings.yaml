# DiagTool settings — tune the test battery here.
# All values have safe defaults in code (diag.diagnostics.DEFAULTS); anything
# you set here overrides them. Units noted per key.

# --- command streaming ---
send_hz: 50.0            # how fast DiagTool streams commands to a robot (Hz)
pose_max_age_s: 0.30     # ignore vision poses older than this when driving
drive_grace_s: 0.5       # keep driving on the last good pose this long after
                         # vision goes stale (bridges brief dropouts instead of
                         # instantly zeroing the command -> avoids false "no motion")
latency_direct_send: false  # true = stream the latency/rotation command straight
                            # to the robot like the real 2026 dispatcher (no vision
                            # gate, no wall guard). Use when vision is unreliable
                            # and you just need to prove the command link works.

# --- motion thresholds (tuned to be above typical vision noise) ---
onset_disp_mm: 12.0      # displacement that counts as "started moving"
onset_angle_rad: 0.05    # rotation that counts as "started turning"
moving_mm_s: 90.0        # speed above which the robot is "moving"
stopped_mm_s: 35.0       # speed below which the robot is "stopped"
vel_window_s: 0.22       # window for the instantaneous velocity estimate

# --- test commanded magnitudes ---
test_speed_ms: 0.30      # linear speed for latency/stop/speed tests (m/s)
test_w_rads: 0.25        # angular speed for the rotation test (rad/s)

# --- repetitions ---
latency_trials: 6
stop_trials: 5
angular_trials: 4
speed_passes: 4

# --- timing / safety windows ---
settle_s: 1.0            # stop-and-wait before/after each motion
accel_settle_s: 0.5      # ignore this much accel before measuring steady speed
stop_buffer_mm: 350.0    # stop a run this far before the arena edge
max_run_s: 4.0           # hard cap on any single run (s)
max_travel_mm: 800.0     # hard cap: stop a run after the robot moves this far
health_window_s: 6.0     # how long the health tests observe
poll_s: 0.004            # vision poll period inside loops

# --- arena / wall safety (make tests stay well away from the walls) ---
# The drive arena is the field minus the keep-off margin minus this inset.
# Robots are actively braked to a stop at the arena edge and never cross it.
# Bigger inset / brake_zone = safer (robots stay further in, slow down sooner).
boundary_inset_mm: 500.0     # shrink the arena this far inside the keep-off margin
brake_zone_mm: 400.0         # start decelerating this far before the arena edge
direct_blind_speed_ms: 0.25  # speed cap for direct/jog moves with NO vision
